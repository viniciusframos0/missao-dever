<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e3f4ff">
<title>Pomar dos Números</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: trilha de frutas em uma coluna → cartão de questão em tela cheia → área do adulto (relatório por habilidade, gabarito, bastidores). Visual único e claro, por escolha. */
:root{
  --sky:#e3f4ff; --sky2:#f6fbff; --grass:#e6f6dc;
  --leaf:#3fa34d; --leaf-d:#2b7a37; --leaf-l:#cdeec9;
  --sun:#ffc93c; --sun-d:#e0a400;
  --fruit:#ff8a3d; --fruit-d:#d96a1f;
  --petal:#ff7a8a; --petal-d:#d9566a;
  --ink:#24323d; --ink2:#5b6c78; --line:#dbe5ec;
  --card:#ffffff; --lock:#c7d3db; --blue:#5aa9e6;
  --display:"Baloo 2","Comic Sans MS",system-ui,sans-serif;
  --body:"Nunito",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:linear-gradient(180deg,var(--sky) 0%,var(--sky2) 55%,var(--grass) 100%);background-attachment:fixed;color:var(--ink);font-family:var(--body);-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;min-height:100%;padding-block:12px 120px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));display:flex;flex-direction:column;gap:14px}
button{font-family:var(--display);cursor:pointer;border:0;color:inherit;background:none}
button:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.1}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px}
.brand h1{font-size:1.65rem;color:var(--fruit-d)}
.pill{background:var(--card);border-radius:999px;padding:6px 14px;font-family:var(--display);font-weight:800;font-size:1.1rem;box-shadow:0 3px 0 rgba(0,0,0,.08);display:flex;gap:6px;align-items:center}
.adult-btn{background:var(--card);border-radius:999px;padding:6px 12px;font-weight:700;font-size:.95rem;box-shadow:0 3px 0 rgba(0,0,0,.08)}
.homework{background:var(--card);border:3px dashed #ffd2b3;border-radius:18px;padding:10px 14px;font-size:.95rem;color:var(--ink2);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.homework b{color:var(--ink)}
.mascot{display:flex;align-items:flex-end;gap:10px}
.mascot .turtle{font-size:3.2rem;line-height:1;animation:bob 2.4s ease-in-out infinite}
.bubble{background:var(--card);border-radius:20px 20px 20px 6px;padding:10px 14px;font-weight:700;font-size:1.05rem;box-shadow:0 3px 0 rgba(0,0,0,.08);flex:1;min-width:0}
@keyframes bob{50%{transform:translateY(-5px) rotate(-3deg)}}

/* trilha */
.path{display:flex;flex-direction:column;align-items:center;gap:24px;padding:16px 0 10px}
.node{display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
.node:nth-child(4n+2){transform:translateX(64px)}
.node:nth-child(4n+4){transform:translateX(-64px)}
.fruitbtn{width:88px;height:88px;border-radius:50%;font-size:2.5rem;display:grid;place-items:center;background:var(--sun);box-shadow:0 7px 0 var(--sun-d)}
.fruitbtn:active{transform:translateY(5px);box-shadow:0 2px 0 var(--sun-d)}
.node.done .fruitbtn{background:var(--leaf);box-shadow:0 7px 0 var(--leaf-d)}
.node.locked .fruitbtn{background:var(--lock);box-shadow:0 7px 0 #a6b4be;filter:grayscale(1);cursor:not-allowed}
.node.current .fruitbtn{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.node .label{font-family:var(--display);font-weight:700;font-size:1.02rem;background:var(--card);padding:2px 12px;border-radius:999px;box-shadow:0 2px 0 rgba(0,0,0,.06);text-align:center}
.node .stars{font-size:1rem;letter-spacing:2px;min-height:1.2em}
.start-tag{position:absolute;top:-28px;background:var(--petal);color:#fff;font-family:var(--display);font-weight:800;padding:2px 12px;border-radius:12px;font-size:.92rem;animation:bob 1.4s ease-in-out infinite}

/* lição */
.lbar{display:flex;align-items:center;gap:10px}
.x{background:var(--card);width:44px;height:44px;border-radius:50%;font-size:1.3rem;box-shadow:0 3px 0 rgba(0,0,0,.08);flex:none}
.prog{flex:1;height:18px;background:#fff;border-radius:999px;overflow:hidden;box-shadow:inset 0 2px 0 rgba(0,0,0,.06)}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--fruit),var(--sun));border-radius:999px;transition:width .4s}
.qcard{background:var(--card);border-radius:26px;padding:16px 14px 18px;box-shadow:0 6px 0 rgba(0,0,0,.07);display:flex;flex-direction:column;gap:14px}
.qtag{font-family:var(--display);font-weight:700;font-size:.85rem;color:var(--ink2);letter-spacing:.04em}
.qhead{display:flex;gap:10px;align-items:flex-start}
.qhead .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.qhead p{margin:0;font-weight:700;font-size:1.05rem;color:var(--ink2)}
.qhead h2{font-size:1.4rem}
.speak{background:var(--sky);width:52px;height:52px;border-radius:16px;font-size:1.5rem;flex:none;box-shadow:0 4px 0 #a9d6f0}
.speak:active{transform:translateY(3px);box-shadow:0 1px 0 #a9d6f0}
.stim{display:flex;flex-direction:column;align-items:center;gap:8px}
.svg{width:100%;max-width:420px;height:auto;display:block}
.svg text{font-family:var(--display)}
.helper{font-family:var(--display);font-weight:800;font-size:1.15rem;color:var(--leaf-d);text-align:center;min-height:1.3em}
.sub{font-size:.95rem;color:var(--ink2);font-weight:700;text-align:center}

.grid{display:grid;gap:4px;width:100%;max-width:440px}
.it{aspect-ratio:1;border-radius:10px;background:#fff7d6;border:2px solid #ffe08a;display:grid;place-items:center;font-size:clamp(.9rem,4.4vw,1.5rem);position:relative;cursor:pointer;padding:0;line-height:1}
.it.done{background:var(--leaf-l);border-color:var(--leaf)}
.it .num{position:absolute;right:1px;bottom:0;font-family:var(--display);font-weight:800;font-size:.62rem;color:var(--leaf-d);line-height:1}
.it.crossed{opacity:.45;background:#ffe3e6;border-color:var(--petal)}
.it.crossed::after{content:"✕";position:absolute;inset:0;display:grid;place-items:center;color:var(--petal-d);font-size:1.6em;font-weight:800}

.seq{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.seq span{min-width:52px;height:56px;padding:0 6px;border-radius:14px;background:#fff7d6;border:3px solid var(--sun);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.5rem}
.seq span.blank{background:#fff;border-style:dashed;color:var(--fruit-d);animation:pulse 1.4s infinite}
.seq span.filled{background:var(--leaf-l);border:3px solid var(--leaf);animation:none}
.seq i{align-self:center;color:var(--ink2);font-style:normal;font-weight:800}

table{border-collapse:collapse;font-size:1.05rem;font-variant-numeric:tabular-nums;min-width:240px}
th,td{border:2px solid var(--line);padding:8px 12px;text-align:left}
th{background:var(--sky);font-family:var(--display)}
td:last-child,th:last-child{text-align:center;font-weight:800}
.tblwrap{overflow-x:auto;max-width:100%}

.timeline{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.tl{width:88px;border:3px solid var(--line);border-radius:14px;padding:6px 4px;text-align:center;background:#fff}
.tl b{display:block;font-size:2rem;line-height:1.1}
.tl small{font-weight:800;font-size:.72rem;letter-spacing:.02em}

.trays{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;max-width:400px}
.tray{border-radius:14px;background:#f3e2d3;border:3px solid #c49470;padding:6px;display:grid;grid-template-columns:repeat(5,1fr);gap:3px;position:relative}
.tray i{aspect-ratio:1;border-radius:50%;background:#e9a23b}
.tray.done{background:var(--leaf-l);border-color:var(--leaf)}
.tray .tag{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.4rem;color:var(--leaf-d);background:rgba(255,255,255,.55);border-radius:10px}

.dourado{display:flex;gap:6px;align-items:flex-end;justify-content:center;flex-wrap:wrap}
.bar10{display:grid;grid-template-rows:repeat(10,13px);gap:1px;padding:2px;background:#c9772a;border-radius:4px;cursor:pointer}
.bar10 i,.cube i{width:13px;background:#ffb85c;border-radius:2px;display:block}
.cube{padding:2px;background:#c9772a;border-radius:4px;cursor:pointer}
.cube i{height:13px}
.cubes{display:grid;grid-template-columns:repeat(3,auto);gap:4px;margin-left:10px}

.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.chips span{font-family:var(--display);font-weight:800;font-size:1.7rem;background:#fff7d6;border:3px solid var(--sun);border-radius:16px;padding:2px 16px}

/* opções */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts.one{grid-template-columns:1fr}
.opt{background:#fff;border:3px solid var(--line);border-radius:18px;padding:10px;font-size:1.25rem;font-weight:700;box-shadow:0 5px 0 var(--line);display:flex;align-items:center;gap:10px;text-align:left;min-height:64px;transition:transform .1s}
.opt .lt{flex:none;width:30px;height:30px;border-radius:9px;background:var(--sky);display:grid;place-items:center;font-size:1rem;font-weight:800;color:var(--ink2)}
.opt .v{flex:1;min-width:0;display:flex;justify-content:center;align-items:center}
.opt .v.emo{font-size:2.6rem;line-height:1}
.opt .v svg{width:100%;max-width:150px;height:auto}
.opt:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.opt.right{border-color:var(--leaf);background:var(--leaf-l);box-shadow:0 5px 0 var(--leaf)}
.opt.wrong{border-color:var(--petal);background:#ffe3e6;box-shadow:0 5px 0 var(--petal);opacity:.55;animation:shake .4s}
.opt[disabled]{cursor:default}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

/* feedback */
.fb{position:fixed;left:0;right:0;bottom:0;padding:16px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));transform:translateY(110%);transition:transform .3s cubic-bezier(.2,1.3,.5,1);z-index:20}
.fb.show{transform:none}
.fb .in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.fb.ok{background:#d7f5d2} .fb.no{background:#ffe1e5}
.fb h3{font-size:1.45rem}
.fb.ok h3{color:var(--leaf-d)} .fb.no h3{color:var(--petal-d)}
.fb p{margin:0;font-weight:700;font-size:1.05rem}
.big{width:100%;padding:15px;border-radius:18px;font-size:1.35rem;font-weight:800;color:#fff;background:var(--leaf);box-shadow:0 6px 0 var(--leaf-d)}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 var(--leaf-d)}
.big.sun{background:var(--sun);color:var(--ink);box-shadow:0 6px 0 var(--sun-d)}
.big.fruit{background:var(--fruit);box-shadow:0 6px 0 var(--fruit-d)}

.center{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding-top:16px}
.trophy{font-size:5rem;animation:bob 2s ease-in-out infinite}
.bigstars{font-size:2.8rem;letter-spacing:6px}

/* área do adulto */
.gate{position:fixed;inset:0;background:rgba(36,50,61,.55);display:grid;place-items:center;z-index:40;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.gate .qcard{max-width:380px;width:100%;text-align:center}
.adult{font-family:var(--body)}
.adult h2{font-size:1.5rem}
.panel{background:var(--card);border-radius:20px;padding:16px;box-shadow:0 4px 0 rgba(0,0,0,.06);display:flex;flex-direction:column;gap:10px}
.panel h3{font-size:1.2rem}
.panel p{margin:0;color:var(--ink2);font-weight:600;line-height:1.45}
.skill{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;font-size:.95rem}
.skill .code{font-family:var(--display);font-weight:800;background:var(--sky);border-radius:8px;text-align:center;padding:2px 0}
.skill .name{font-weight:700;min-width:0}
.meter{height:8px;border-radius:99px;background:#edf2f5;overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;border-radius:99px}
.state{font-family:var(--display);font-weight:800;font-size:.85rem;padding:2px 10px;border-radius:99px;white-space:nowrap}
.state.ok{background:var(--leaf-l);color:var(--leaf-d)}
.state.mid{background:#fff1c7;color:#8a6200}
.state.bad{background:#ffe1e5;color:var(--petal-d)}
.state.none{background:#edf2f5;color:var(--ink2)}
.rev{display:flex;gap:10px;align-items:center;border-top:2px solid #edf2f5;padding-top:8px;font-size:.92rem}
.rev .q{flex:1;min-width:0}
.rev .q b{font-family:var(--display)}
.rev .q span{color:var(--ink2);font-weight:700}
.chk{border:3px solid var(--line);border-radius:12px;padding:4px 10px;font-weight:800;font-size:.9rem;white-space:nowrap}
.chk.on{background:var(--leaf-l);border-color:var(--leaf);color:var(--leaf-d)}
.kpi{display:flex;gap:10px;flex-wrap:wrap}
.kpi div{flex:1;min-width:120px;background:var(--sky2);border:2px solid var(--line);border-radius:14px;padding:8px 12px}
.kpi b{display:block;font-family:var(--display);font-size:1.6rem;font-variant-numeric:tabular-nums}
.kpi small{color:var(--ink2);font-weight:700}
details summary{cursor:pointer;font-weight:800;color:var(--blue)}
pre{background:#22303a;color:#e4f1f8;border-radius:12px;padding:12px;font-size:.72rem;overflow-x:auto;max-height:320px;white-space:pre}
.reset{color:var(--ink2);font-family:var(--body);font-weight:700;text-decoration:underline;padding:8px}

.confetti{position:fixed;top:-40px;font-size:1.8rem;pointer-events:none;z-index:30;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
.hub{display:inline-block;font-family:var(--display);font-weight:700;font-size:.95rem;color:var(--ink2);text-decoration:none;background:var(--card);padding:4px 12px;border-radius:999px;box-shadow:0 2px 0 rgba(0,0,0,.06);align-self:flex-start}
</style>

</head>
<body>
<div class="wrap" id="app"></div>
<div class="fb" id="fb"><div class="in"><h3 id="fbT"></h3><p id="fbP"></p><button class="big" id="fbB">Continuar</button></div></div>

<script>
/* =====================================================================
   1) ATIVIDADE — é só isto que a IA precisa gerar a partir da foto/PDF.
      Uma lista curta de questões, cada uma com um "tipo de estímulo".
   ===================================================================== */
const ATIVIDADE = {
  titulo:"Simulado SAEB · Matemática", serie:"2º ano", origem:"Criança Alfabetizada · SEMED",
  fases:[
    {id:"contar",  icone:"🍎", nome:"Contar",            intro:"Vamos contar! Toque em cada coisa, uma de cada vez.", q:[7,14,18,19,17]},
    {id:"seq",     icone:"🐛", nome:"Sequências",        intro:"Os números estão em fila. Descubra quem está faltando!", q:[3,15]},
    {id:"contas",  icone:"🍬", nome:"Continhas",         intro:"Alguém deu ou usou coisas. Quanto sobrou?", q:[2,13]},
    {id:"graf",    icone:"📊", nome:"Gráficos e tabelas",intro:"Gráficos e tabelas contam histórias com números.", q:[4,8,10]},
    {id:"formas",  icone:"🔺", nome:"Formas",            intro:"Quadrado, triângulo, pirâmide… vamos achar as formas!", q:[6,9]},
    {id:"medidas", icone:"📏", nome:"Medidas",           intro:"Curto ou comprido? Perto ou longe? Fino ou largo?", q:[1,20,5]},
    {id:"tempo",   icone:"⏰", nome:"Horas e dinheiro",  intro:"Relógio, moedas e notas. Vamos lá!", q:[16,12,11]}
  ],
  questoes:[
    {n:1, d:"D20", hab:"Comparar comprimentos", enun:"Observe os quatro lápis que Ana Clara leva no estojo.", perg:"Qual desses lápis é o mais curto?", est:{tipo:"lapis",tam:[150,255,190,110]}, ops:["I","II","III","IV"], resp:3, dica:"Curto é o contrário de comprido. Procure o lápis menorzinho!"},
    {n:2, d:"D09", hab:"Subtração (tirar)", enun:"Ravi tinha 18 balas. Ele deu 9 balas para o primo.", perg:"Com quantas balas Ravi ficou?", est:{tipo:"riscar",emoji:"🍬",total:18,cols:6,acao:"Risque as 9 balas que ele deu."}, ops:["27","19","9","6"], resp:2, dica:"Ele deu balas, então ficou com menos. Risque 9 e conte as que sobraram."},
    {n:3, d:"D05", hab:"Completar sequência", enun:"Observe a sequência. Ela segue um padrão.", perg:"Qual número completa a sequência?", est:{tipo:"sequencia",itens:[null,31,33,35,37,39]}, ops:["29","30","32","40"], resp:0, dica:"Os números pulam de 2 em 2. Qual vem antes do 31?"},
    {n:4, d:"D32", hab:"Ler gráfico de barras", enun:"O gráfico mostra os animais que Clinton tem no sítio.", perg:"Qual animal ele tem em maior quantidade?", est:{tipo:"barras",rot:["Cachorro","Gato","Porco","Galinha"],val:[10,20,5,15],max:20,passo:5,y:"Animais"}, ops:["Cachorro","Galinha","Gato","Porco"], resp:2, dica:"Procure a barra mais alta."},
    {n:5, d:"D17", hab:"Localização (perto e longe)", enun:"Este é o desenho da sala de aula. A porta fica do lado direito.", perg:"Quem está mais longe da porta?", est:{tipo:"sala"}, ops:[{e:"🧒",a:"a criança na mesa"},{e:"👧",a:"a menina no meio da sala"},{e:"👩",a:"a professora perto da porta"},{e:"👦",a:"o menino na porta"}], resp:0, dica:"Coloque o dedo na porta. Quem está do outro lado da sala?"},
    {n:6, d:"D19", hab:"Figuras planas", enun:"Observe as figuras na malha quadriculada.", perg:"Qual dessas figuras é um quadrado?", est:{tipo:"malha"}, ops:["I","II","III","IV"], resp:0, dica:"O quadrado tem 4 lados do mesmo tamanho e cantos retinhos."},
    {n:7, d:"D04", hab:"Contar objetos", enun:"Veja os produtos que uma loja colocou em promoção.", perg:"Quantos produtos estão em promoção?", est:{tipo:"contar",itens:["🍳","📻","📺","🫖","⏰","🔦","🧺","☕","🍳","📻","📺","🫖","⏰","🔦","🧺","☕"],cols:8}, ops:["17","16","14","13"], resp:1, dica:"Toque em cada produto para contar, um por um."},
    {n:8, d:"D31", hab:"Ler tabela", enun:"A tabela mostra os brinquedos que Ycaro tem.", perg:"Quantos carrinhos Ycaro tem?", est:{tipo:"tabela",cab:["Brinquedo","Quantidade"],lin:[["⚽ Bola","6"],["🚗 Carrinho","23"],["🤖 Robô","8"],["🏍️ Motocicleta","16"]]}, ops:["23","16","8","6"], resp:0, dica:"Ache a linha do carrinho e siga até a quantidade."},
    {n:9, d:"D17", hab:"Figuras espaciais", enun:"Veja as figuras geométricas.", perg:"Qual dessas figuras é uma pirâmide?", est:{tipo:"solidos"}, ops:["I","II","III","IV"], resp:3, dica:"A pirâmide tem bico em cima e a base com cantos."},
    {n:10,d:"D32", hab:"Gráfico e adição", enun:"O gráfico mostra as frutas que um mercadinho vendeu de manhã.", perg:"Quantos cajus e maçãs foram vendidos ao todo?", est:{tipo:"barras",rot:["Caju","Banana","Jaca","Maçã","Laranja"],val:[30,60,10,40,50],max:60,passo:10,y:"Frutas"}, ops:["30","40","50","70"], resp:3, dica:"Veja quantos cajus, veja quantas maçãs e junte os dois."},

  const u=unlockedIdx(), allDone=u>=F.length;
  $app.innerHTML="";
  $app.appendChild(h(`<a class="hub" href="../../" aria-label="Voltar para todas as missões">← Missões</a>`));
  const top=h(`<div class="top"><div class="brand"><span style="font-size:2rem">🍊</span><h1>Pomar dos Números</h1></div><div style="display:flex;gap:8px"><div class="pill">⭐ ${totalStars()}</div><button class="adult-btn">👨‍👩‍👦 Adulto</button></div></div>`);
  top.querySelector(".adult-btn").onclick=gate;
  $app.appendChild(top);
  $app.appendChild(h(`<div class="homework"><span>${ATIVIDADE.titulo}</span><span><b>${ATIVIDADE.serie}</b> · 20 questões</span></div>`));
  const left=F.length-u;
  const msg = allDone ? "Você colheu o pomar inteiro! Toque na cesta 🧺 para ver suas frutas."
            : u===0 ? "Oi! Sou a Tuca. Cada fruta é um desafio de matemática. Toque na que está pulando!"
            : `Muito bem! Falta${left>1?"m":""} ${left} fruta${left>1?"s":""} no pomar.`;
  const m=h(`<div class="mascot"><div class="turtle">🐢</div><div class="bubble">${msg}</div></div>`); m.onclick=()=>say(msg);
  $app.appendChild(m);
  const path=h(`<div class="path"></div>`);
  F.forEach((f,i)=>{
    const st=save.stars[f.id]||0, locked=i>u, cur=i===u;
    const n=h(`<div class="node ${st?"done":""} ${locked?"locked":""} ${cur?"current":""}">${cur?'<span class="start-tag">COMEÇAR</span>':""}
      <button class="fruitbtn" aria-label="${f.nome}">${locked?"🔒":f.icone}</button>
      <span class="label">${f.nome}</span><span class="stars">${st?"⭐".repeat(st)+"☆".repeat(3-st):""}</span></div>`);
    n.querySelector("button").onclick=()=>{ if(locked){ sfx.no(); say("Termine a fruta de antes primeiro!"); return; } sfx.tap(); startPhase(i); };
    path.appendChild(n);
  });
  const fin=h(`<div class="node ${allDone?"current":"locked"}"><button class="fruitbtn" style="${allDone?"background:var(--fruit);box-shadow:0 7px 0 var(--fruit-d)":""}">🧺</button><span class="label">Minha colheita</span></div>`);
  fin.querySelector("button").onclick=()=>{ if(!allDone){ sfx.no(); say("Complete todas as frutas primeiro!"); return; } showHarvest(); };
  path.appendChild(fin);
  $app.appendChild(path);
}

let P, qi, mistakes, phaseIdx;
function startPhase(i){ phaseIdx=i; P=F[i]; qi=0; mistakes=0; track(`fase-inicio/${P.id}`); intro(); }
function frame(){
  $app.innerHTML="";
  const bar=h(`<div class="lbar"><button class="x" aria-label="Sair">✕</button><div class="prog"><i></i></div><div class="pill">${P.icone}</div></div>`);
  bar.querySelector(".x").onclick=()=>{ try{speechSynthesis.cancel()}catch(e){} showMap(); };
  $app.appendChild(bar);
  requestAnimationFrame(()=>bar.querySelector("i").style.width=(qi/P.q.length*100)+"%");
  const w=h(`<div style="display:flex;flex-direction:column;gap:14px"></div>`); $app.appendChild(w); return w;
}
function intro(){
  const w=frame();
  w.appendChild(h(`<div class="center"><div class="trophy">${P.icone}</div><h2 style="font-size:2rem">${P.nome}</h2></div>`));
  const m=h(`<div class="mascot"><div class="turtle">🐢</div><div class="bubble">${P.intro}</div></div>`); m.onclick=()=>say(P.intro);
  w.appendChild(m);
  const b=h(`<button class="big sun">Vamos lá! ▶</button>`); b.onclick=()=>{ sfx.tap(); question(); };
  w.appendChild(b); say(P.intro);
}
function question(){
  hideFb();
  const q=Q[P.q[qi]], w=frame();
  const card=h(`<div class="qcard"></div>`); w.appendChild(card);
  card.appendChild(h(`<div class="qtag">QUESTÃO ${String(q.n).padStart(2,"0")} DA FOLHA</div>`));
  const head=h(`<div class="qhead"><div class="txt"><p>${q.enun}</p><h2>${q.perg}</h2></div><button class="speak" aria-label="Ouvir">🔊</button></div>`);
  head.querySelector(".speak").onclick=()=>say(q.enun+" "+q.perg);
  card.appendChild(head);
  const stim=EST[q.est.tipo](q.est,q); if(stim) card.appendChild(stim);
  const visual=q.ops.some(o=>typeof o!=="string"), long=q.ops.some(o=>typeof o==="string"&&o.length>10);
  const g=h(`<div class="opts ${long?"one":""}"></div>`);
  let answered=false;
  q.ops.forEach((o,i)=>{
    const b=h(`<button class="opt"><span class="lt">${LET[i]}</span>${optView(o)}</button>`);
    b.onclick=()=>{
      if(!answered){ answered=true; save.res[q.n]={first:i, ok:i===q.resp}; persist(); }
      if(visual||long) say(optSpeech(o));
      if(i===q.resp){ b.classList.add("right"); g.querySelectorAll(".opt").forEach(x=>x.disabled=true); stim&&stim._onRight&&stim._onRight(); right(); }
      else { b.classList.add("wrong"); b.disabled=true; mistakes++; wrong(q.dica); }
    };
    g.appendChild(b);
  });
  card.appendChild(g);
  say(q.enun+" "+q.perg);
}
const fb=document.getElementById("fb"),fbT=document.getElementById("fbT"),fbP=document.getElementById("fbP"),fbB=document.getElementById("fbB");
function hideFb(){ fb.className="fb"; }
function right(){
  sfx.ok(); const p=rnd(PRAISE); fbT.textContent="🎉 "+p; fbP.textContent=""; fb.className="fb ok show"; fbB.hidden=false; say(p);
  fbB.onclick=()=>{ sfx.tap(); qi++; qi<P.q.length?question():finishPhase(); };
}
function wrong(d){
  sfx.no(); const t=d||"Olhe com calma e tente de novo!"; fbT.textContent="🐢 Quase! Uma dica:"; fbP.textContent=t;
  fb.className="fb no show"; fbB.hidden=true; say(t); clearTimeout(wrong.t); wrong.t=setTimeout(hideFb,3200);
}
function finishPhase(){
  hideFb();
  const st=mistakes===0?3:mistakes<=2?2:1;
  save.stars[P.id]=Math.max(save.stars[P.id]||0,st); persist();
  track(`fase-fim/${P.id}/${st}-estrelas`);
  const w=frame(); document.querySelector(".prog i").style.width="100%";
  const msg=st===3?"Uau! Sem nenhum erro!":st===2?"Muito bom! Você é fera!":"Você conseguiu! Cada vez fica mais fácil.";
  w.appendChild(h(`<div class="center"><div class="trophy">${P.icone}</div><h2 style="font-size:2rem">Fruta colhida!</h2><div class="bigstars">${"⭐".repeat(st)}${"☆".repeat(3-st)}</div><p class="bubble" style="flex:none">${msg}</p></div>`));
  const last=phaseIdx===F.length-1;
  const b=h(`<button class="big">${last?"Ver minha colheita 🧺":"Voltar ao pomar 🌳"}</button>`);
  b.onclick=()=>{ sfx.tap(); last?showHarvest():showMap(); };
  w.appendChild(b); sfx.win(); confetti(); say("Fruta colhida! "+msg);
}
function showHarvest(){
  track("jogo-completo");
  $app.innerHTML="";
  const ok=Object.values(save.res).filter(r=>r.ok).length;
  const back=h(`<div class="lbar"><button class="x" aria-label="Voltar">←</button><h2 style="font-size:1.5rem">Minha colheita</h2></div>`);
  back.querySelector(".x").onclick=showMap; $app.appendChild(back);
  $app.appendChild(h(`<div class="center"><div class="trophy">🧺</div><div class="bigstars">⭐ ${totalStars()} / ${F.length*3}</div><p class="bubble" style="flex:none">Você acertou ${ok} de 20 de primeira! Mostre para quem cuida de você.</p></div>`));
  const b=h(`<button class="big fruit">Mostrar para um adulto 👨‍👩‍👦</button>`); b.onclick=gate; $app.appendChild(b);
  confetti(30); sfx.win();
}

/* ---------- portão dos pais + área do adulto ---------- */
function gate(){
  try{speechSynthesis.cancel()}catch(e){}
  const g=h(`<div class="gate"><div class="qcard"><h2>Área dos pais e professores</h2><p style="margin:0;font-weight:700;color:var(--ink2)">Para entrar, responda: quanto é 7 × 8?</p><div class="opts" style="grid-template-columns:repeat(3,1fr)"></div><button class="reset">Cancelar</button></div></div>`);
  const o=g.querySelector(".opts");
  [54,56,63].forEach(n=>{ const b=h(`<button class="opt" style="justify-content:center">${n}</button>`); b.onclick=()=>{ g.remove(); n===56?showAdult():showMap(); }; o.appendChild(b); });
  g.querySelector(".reset").onclick=()=>g.remove();
  document.body.appendChild(g);
}
function showAdult(){
  track("area-adulto");
  hideFb(); $app.innerHTML=""; $app.classList.add("adult");
  const back=h(`<div class="lbar"><button class="x" aria-label="Voltar">←</button><h2>Área do adulto</h2></div>`);
  back.querySelector(".x").onclick=()=>{ $app.classList.remove("adult"); showMap(); }; $app.appendChild(back);
  const qs=ATIVIDADE.questoes, done=qs.filter(q=>save.res[q.n]), ok=done.filter(q=>save.res[q.n].ok);

  // relatório
  const rep=h(`<div class="panel"><h3>Relatório por habilidade</h3><p>Acerto na <b>primeira tentativa</b>, agrupado pelo descritor que aparece em cada questão da folha.</p>
    <div class="kpi"><div><b>${done.length}/20</b><small>questões feitas</small></div><div><b>${ok.length}</b><small>certas de primeira</small></div><div><b>${totalStars()}/${F.length*3}</b><small>estrelas</small></div></div></div>`);
  const by={}; qs.forEach(q=>{ (by[q.d]=by[q.d]||[]).push(q); });
  Object.keys(by).sort().forEach(d=>{
    const list=by[d], f=list.filter(q=>save.res[q.n]), c=f.filter(q=>save.res[q.n].ok).length;
    const cls=!f.length?"none":c===f.length?"ok":c===0?"bad":"mid";
    const lab=!f.length?"não feito":c===f.length?"domina":c===0?"reforçar":"em progresso";
    const col={ok:"var(--leaf)",mid:"var(--sun)",bad:"var(--petal)",none:"var(--lock)"}[cls];
    const names=[...new Set(list.map(q=>q.hab))].join(" · ");
    rep.appendChild(h(`<div class="skill"><span class="code">${d}</span><div class="name">${names} <span style="color:var(--ink2);font-weight:600">(Q${list.map(q=>q.n).join(", Q")})</span><div class="meter"><i style="width:${f.length?c/list.length*100:0}%;background:${col}"></i></div></div><span class="state ${cls}">${lab}</span></div>`));
  });
  const wrongs=qs.filter(q=>save.res[q.n]&&!save.res[q.n].ok);
  if(wrongs.length) rep.appendChild(h(`<p><b>Para conversar em casa:</b> ${wrongs.map(q=>`Q${q.n} (${q.hab.toLowerCase()}): marcou ${LET[save.res[q.n].first]}, o certo é ${LET[q.resp]}`).join("; ")}.</p>`));
  $app.appendChild(rep);

  // revisão do gabarito
  const rv=h(`<div class="panel"><h3>Conferir gabarito</h3><p>A IA leu a folha e montou estas respostas. Antes de liberar para as crianças, o professor ou responsável confere cada uma.</p><p id="revc"></p></div>`);
  const upd=()=>rv.querySelector("#revc").innerHTML=`<b>${Object.values(save.rev).filter(Boolean).length} de 20 conferidas</b>`;
  qs.forEach(q=>{
    const ans=q.ops[q.resp]; const txt=typeof ans==="string"?ans:(ans.a||"a porta mais fina (B)");
    const r=h(`<div class="rev"><div class="q"><b>Q${q.n} · ${q.d}</b> ${q.perg}<br><span>Resposta: ${LET[q.resp]}) ${txt}</span></div><button class="chk ${save.rev[q.n]?"on":""}">${save.rev[q.n]?"✔ Conferida":"Conferir"}</button></div>`);
    const b=r.querySelector(".chk"); b.onclick=()=>{ save.rev[q.n]=!save.rev[q.n]; persist(); b.classList.toggle("on",!!save.rev[q.n]); b.textContent=save.rev[q.n]?"✔ Conferida":"Conferir"; upd(); };
    rv.appendChild(r);
  });
  upd(); $app.appendChild(rv);

  const r=h(`<button class="reset">Apagar progresso desta criança</button>`);
  r.onclick=()=>{ if(r.dataset.c){ save={stars:{},res:{},rev:save.rev}; persist(); $app.classList.remove("adult"); showMap(); } else { r.dataset.c=1; r.textContent="Toque de novo para confirmar"; } };
  $app.appendChild(r);
  window.scrollTo(0,0);
}

showMap();
</script>
